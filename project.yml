name: Libretilla
options:
  bundleIdPrefix: app.libretilla
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    # Bump both for every release (docs/RELEASING.md). The build number must always grow:
    # Sparkle compares CURRENT_PROJECT_VERSION.
    MARKETING_VERSION: "0.9"
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle's update feed and the EdDSA public key it checks updates with (docs/RELEASING.md).
    # Without a key the updater refuses to check, and scripts/make-dmg.sh refuses to build.
    SPARKLE_FEED_URL: https://github.com/escalant3/libretilla/releases/latest/download/appcast.xml
    SPARKLE_PUBLIC_KEY: "Pcwsejzjf4n9qKYpjKNPD6qSG0XXMHtiYfqTrf7pG7o="
packages:
  LibretillaDocx:
    path: Packages/LibretillaDocx
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Libretilla:
    type: application
    platform: macOS
    sources:
      - App
      - Document
      - Editor
      - path: UI
        excludes: ["**/*.md"]
      - Resources
    dependencies:
      - package: LibretillaDocx
      - package: Sparkle
    entitlements:
      path: App/Libretilla.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Sparkle's installer XPC service, which a sandboxed app must reach (Sparkle's sandboxing guide).
        # There is no network entitlement: Sparkle's Downloader XPC service fetches updates.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Libretilla
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Diego Escalante. MIT License."
        NSPrincipalClass: NSApplication
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        SUEnableSystemProfiling: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Word Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
            NSDocumentClass: $(PRODUCT_MODULE_NAME).LibretillaDocument
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.libretilla.Libretilla
        PRODUCT_NAME: Libretilla
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  LibretillaTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Libretilla
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Libretilla.app/Contents/MacOS/Libretilla
        GENERATE_INFOPLIST_FILE: YES
  LibretillaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Libretilla
      - package: LibretillaDocx
    settings:
      base:
        TEST_TARGET_NAME: Libretilla
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Libretilla:
    build:
      targets:
        Libretilla: all
        LibretillaTests: [test]
        LibretillaUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - LibretillaTests
        - name: LibretillaUITests
          skipped: false
