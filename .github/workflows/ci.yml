name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (arm64, macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version
          uname -m

      - name: Lint (swift format, strict)
        run: |
          find App Document Editor UI Tests UITests Packages/LibretillaDocx \
            -name '*.swift' -not -path '*/.build/*' -print0 | xargs -0 swift format lint --strict

      - name: Xcode project is in sync with project.yml
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --quiet
          git diff --exit-code -- Libretilla.xcodeproj App/Info.plist App/Libretilla.entitlements

      - name: Fixture corpus is reproducible
        run: |
          python3 scripts/fixtures/make_corpus.py
          git diff --exit-code -- Fixtures/generated Resources/Blank.docx

      - name: LibretillaDocx package tests
        working-directory: Packages/LibretillaDocx
        run: swift test

      - name: Build and test app (unit + UI)
        run: |
          set -o pipefail
          mkdir -p build
          # TEST_RUNNER_ passes LIBRETILLA_CI to the test runners (see PolishUITests).
          TEST_RUNNER_LIBRETILLA_CI=1 xcodebuild test \
            -project Libretilla.xcodeproj -scheme Libretilla \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee build/xcodebuild.log | grep -E '^(Test Case|\*\*)|: error: ' || true
          grep -q '\*\* TEST SUCCEEDED \*\*' build/xcodebuild.log

      - name: Collect crash reports on failure
        if: failure()
        run: |
          mkdir -p build/crash-reports
          for dir in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            find "$dir" -iname 'Libretilla*' -exec cp {} build/crash-reports/ \; 2>/dev/null || true
          done
          ls -l build/crash-reports

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult
          path: |
            build/DerivedData/Logs/Test/*.xcresult
            build/crash-reports
