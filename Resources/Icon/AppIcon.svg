<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF4"/>
      <stop offset="1" stop-color="#EEF3FB"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA2FF"/>
      <stop offset="1" stop-color="#2F6FE0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/>
      <stop offset="0.55" stop-color="#C9D0DC"/>
      <stop offset="1" stop-color="#9AA4B5"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1B2A4A" flood-opacity="0.22"/>
    </filter>
    <clipPath id="coverClip">
      <rect x="330" y="232" width="420" height="560" rx="42"/>
    </clipPath>
    <g id="ring1">
        <path d="M318 14 C 300 12, 294 4, 296 -4" stroke="#1E3A7A" stroke-width="26" stroke-linecap="round" fill="none"/>
        <path d="M318 14 C 300 12, 294 4, 296 -4" stroke="#7D889C" stroke-width="12" stroke-linecap="round" fill="none"/>
        <path d="M296 -4 C 300 -36, 356 -34, 372 0" stroke="#1E3A7A" stroke-width="28" stroke-linecap="round" fill="none"/>
        <path d="M296 -4 C 300 -36, 356 -34, 372 0" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" fill="none"/>
        <path d="M312 -18 C 322 -26, 336 -26, 346 -22" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.95"/>
      </g>
  </defs>

  <!-- macOS squircle tile with light background -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#iconShadow)"/>


  <g transform="translate(-40 -23)">
    <!-- page stack peeking out -->
    <rect x="356" y="256" width="420" height="560" rx="40" fill="#E8ECF3" stroke="#1E3A7A" stroke-width="14"/>
    <rect x="343" y="244" width="420" height="560" rx="41" fill="#FFFFFF" stroke="#1E3A7A" stroke-width="14"/>

    <!-- cover -->
    <rect x="330" y="232" width="420" height="560" rx="42" fill="url(#cover)"/>
    <g clip-path="url(#coverClip)">
      <!-- cartoon shine -->
      <path d="M560 232 L640 232 L470 792 L390 792 Z" fill="#FFFFFF" opacity="0.16"/>
      <path d="M660 232 L690 232 L520 792 L490 792 Z" fill="#FFFFFF" opacity="0.12"/>
      <!-- bottom shade -->
      <rect x="330" y="740" width="420" height="60" fill="#1E3A7A" opacity="0.18"/>
      <!-- elastic band -->
      <rect x="690" y="232" width="24" height="560" fill="#1E3A7A" opacity="0.85"/>
    </g>
    <rect x="330" y="232" width="420" height="560" rx="42" fill="none" stroke="#1E3A7A" stroke-width="14"/>

    <!-- label -->
    <rect x="420" y="330" width="230" height="150" rx="22" fill="#FFFDF6" stroke="#1E3A7A" stroke-width="10"/>
    <rect x="452" y="375" width="166" height="14" rx="7" fill="#9DB8E8"/>
    <rect x="452" y="418" width="118" height="14" rx="7" fill="#9DB8E8"/>

    <!-- punched holes -->
    <g fill="#1E3A7A">
      <circle cx="370" cy="290" r="13"/>
      <circle cx="370" cy="360" r="13"/>
      <circle cx="370" cy="430" r="13"/>
      <circle cx="370" cy="500" r="13"/>
      <circle cx="370" cy="570" r="13"/>
      <circle cx="370" cy="640" r="13"/>
      <circle cx="370" cy="710" r="13"/>
    </g>

    <!-- spiral rings -->
    <g id="rings">
      <use href="#ring1" y="290"/>
      <use href="#ring1" y="360"/>
      <use href="#ring1" y="430"/>
      <use href="#ring1" y="500"/>
      <use href="#ring1" y="570"/>
      <use href="#ring1" y="640"/>
      <use href="#ring1" y="710"/>
    </g>
  </g>
</svg>
